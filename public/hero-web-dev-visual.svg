<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Web developer workspace: a code editor and browser window hanging in a crimson spider web">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#d4483b" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#a73a2f" stop-opacity=".18"/>
      <stop offset="1" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0d10"/><stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26262d"/><stop offset="1" stop-color="#15151a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ee6c5c" stop-opacity=".9"/><stop offset="1" stop-color="#a73a2f" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4483b"/><stop offset="1" stop-color="#ee6c5c"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000" flood-opacity=".7"/>
    </filter>
    <style>
      .f1{animation:f1 7s ease-in-out infinite}
      .f2{animation:f2 8.5s ease-in-out infinite}
      .f3{animation:f3 6.5s ease-in-out infinite}
      .sp{animation:sp 6s ease-in-out infinite;transform-origin:400px 60px}
      @keyframes f1{50%{transform:translateY(-12px)}}
      @keyframes f2{50%{transform:translateY(10px)}}
      @keyframes f3{50%{transform:translateY(-8px)}}
      @keyframes sp{50%{transform:translateY(22px)}}
      @media (prefers-reduced-motion:reduce){.f1,.f2,.f3,.sp{animation:none}}
    </style>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- web: spokes and rings anchored top-right and bottom-left -->
  <g fill="none" stroke="#edeae3" stroke-opacity=".13" stroke-width="1.4" stroke-linecap="round">
    <g id="webA">
      <path d="M800 0L430 330M800 0L330 190M800 0L560 470M800 0L250 40M800 0L690 560"/>
      <path d="M700 0Q650 70 600 10M600 0Q560 120 480 40"/>
      <path d="M740 130Q690 160 640 120Q585 170 520 140"/>
      <path d="M690 240Q640 290 590 240Q530 300 470 260Q420 320 380 280"/>
      <path d="M640 360Q585 400 545 360Q490 420 440 380"/>
    </g>
    <g transform="translate(800 1000) rotate(180)" opacity=".7">
      <path d="M800 0L430 330M800 0L330 190M800 0L560 470M800 0L250 40"/>
      <path d="M740 130Q690 160 640 120Q585 170 520 140"/>
      <path d="M690 240Q640 290 590 240Q530 300 470 260"/>
    </g>
  </g>

  <!-- ambient crimson halo behind the editor -->
  <ellipse cx="400" cy="520" rx="270" ry="300" fill="#d4483b" opacity=".35" filter="url(#soft)"/>

  <!-- main code editor window -->
  <g class="f1">
    <g filter="url(#shadow)">
      <rect x="150" y="270" width="470" height="430" rx="16" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    </g>
    <path d="M150 286a16 16 0 0 1 16-16h438a16 16 0 0 1 16 16v34H150z" fill="#1c1c22"/>
    <circle cx="178" cy="295" r="6" fill="#d4483b"/><circle cx="200" cy="295" r="6" fill="#edeae3" opacity=".35"/><circle cx="222" cy="295" r="6" fill="#edeae3" opacity=".35"/>
    <rect x="270" y="287" width="170" height="16" rx="8" fill="#edeae3" opacity=".08"/>
    <!-- gutter -->
    <rect x="150" y="320" width="48" height="380" fill="#111115"/>
    <g fill="#edeae3" opacity=".22">
      <rect x="166" y="344" width="16" height="6" rx="3"/><rect x="166" y="378" width="16" height="6" rx="3"/><rect x="166" y="412" width="16" height="6" rx="3"/>
      <rect x="166" y="446" width="16" height="6" rx="3"/><rect x="166" y="480" width="16" height="6" rx="3"/><rect x="166" y="514" width="16" height="6" rx="3"/>
      <rect x="166" y="548" width="16" height="6" rx="3"/><rect x="166" y="582" width="16" height="6" rx="3"/><rect x="166" y="616" width="16" height="6" rx="3"/>
      <rect x="166" y="650" width="16" height="6" rx="3"/>
    </g>
    <!-- code lines -->
    <g stroke-linecap="round" stroke-width="8">
      <path d="M222 347h64" stroke="#ee6c5c"/><path d="M298 347h96" stroke="#edeae3" opacity=".5"/>
      <path d="M246 381h50" stroke="#d4483b"/><path d="M308 381h120" stroke="#edeae3" opacity=".35"/><path d="M440 381h40" stroke="#ee6c5c" opacity=".7"/>
      <path d="M246 415h90" stroke="#edeae3" opacity=".35"/><path d="M348 415h70" stroke="#d4483b"/>
      <path d="M270 449h130" stroke="#edeae3" opacity=".3"/><path d="M412 449h58" stroke="#ee6c5c" opacity=".7"/>
      <path d="M270 483h56" stroke="#ee6c5c"/><path d="M338 483h100" stroke="#edeae3" opacity=".35"/>
      <path d="M246 517h40" stroke="#d4483b"/>
      <path d="M222 551h72" stroke="#ee6c5c"/><path d="M306 551h140" stroke="#edeae3" opacity=".4"/>
      <path d="M246 585h110" stroke="#edeae3" opacity=".3"/><path d="M368 585h84" stroke="#d4483b"/>
      <path d="M246 619h60" stroke="#ee6c5c" opacity=".8"/><path d="M318 619h130" stroke="#edeae3" opacity=".3"/>
      <path d="M222 653h30" stroke="#d4483b"/>
    </g>
    <!-- active line highlight + caret -->
    <rect x="198" y="468" width="422" height="30" fill="#d4483b" opacity=".08"/>
    <rect x="478" y="470" width="3" height="26" fill="#ee6c5c"/>
  </g>

  <!-- browser preview card -->
  <g class="f2">
    <g filter="url(#shadow)">
      <rect x="420" y="560" width="290" height="260" rx="14" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    </g>
    <path d="M420 574a14 14 0 0 1 14-14h262a14 14 0 0 1 14 14v26H420z" fill="#1c1c22"/>
    <circle cx="442" cy="580" r="5" fill="#d4483b"/><circle cx="460" cy="580" r="5" fill="#edeae3" opacity=".35"/><circle cx="478" cy="580" r="5" fill="#edeae3" opacity=".35"/>
    <rect x="500" y="573" width="190" height="14" rx="7" fill="#edeae3" opacity=".08"/>
    <!-- wireframe page -->
    <rect x="440" y="618" width="130" height="14" rx="7" fill="url(#bar)"/>
    <rect x="440" y="642" width="200" height="8" rx="4" fill="#edeae3" opacity=".3"/>
    <rect x="440" y="660" width="160" height="8" rx="4" fill="#edeae3" opacity=".2"/>
    <rect x="440" y="684" width="76" height="26" rx="13" fill="#d4483b"/>
    <rect x="526" y="684" width="76" height="26" rx="13" fill="none" stroke="#edeae3" stroke-opacity=".35"/>
    <rect x="440" y="728" width="76" height="62" rx="8" fill="#edeae3" opacity=".07"/>
    <rect x="528" y="728" width="76" height="62" rx="8" fill="#edeae3" opacity=".07"/>
    <rect x="616" y="728" width="76" height="62" rx="8" fill="#d4483b" opacity=".25"/>
  </g>

  <!-- floating </> badge -->
  <g class="f3">
    <g filter="url(#shadow)">
      <rect x="90" y="560" width="150" height="150" rx="26" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    </g>
    <g fill="none" stroke="#ee6c5c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M142 608l-24 27 24 27"/><path d="M188 608l24 27-24 27"/>
    </g>
    <path d="M176 600l-20 70" stroke="#edeae3" stroke-opacity=".7" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>

  <!-- metrics chip -->
  <g class="f3" style="animation-delay:-3s">
    <g filter="url(#shadow)">
      <rect x="520" y="190" width="200" height="86" rx="16" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    </g>
    <polyline points="542,252 576,228 604,240 640,212 676,222 700,200" fill="none" stroke="#ee6c5c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="700" cy="200" r="7" fill="#ee6c5c"/>
    <rect x="542" y="208" width="60" height="7" rx="3.5" fill="#edeae3" opacity=".3"/>
  </g>

  <!-- spider on a thread -->
  <g class="sp">
    <line x1="400" y1="-10" x2="400" y2="168" stroke="#edeae3" stroke-opacity=".5" stroke-width="2"/>
    <g transform="translate(400 190)">
      <g stroke="#edeae3" stroke-opacity=".75" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-8 -4l-26 -14 -14 14M-9 2l-32 -2 -14 14M-9 8l-30 12 -10 20M-7 13l-20 22 -4 20"/>
        <path d="M8 -4l26 -14 14 14M9 2l32 -2 14 14M9 8l30 12 10 20M7 13l20 22 4 20"/>
      </g>
      <ellipse cx="0" cy="14" rx="15" ry="19" fill="#d4483b"/>
      <ellipse cx="0" cy="-6" rx="10" ry="10" fill="#a73a2f"/>
      <path d="M-5 12l5 8 5-8z" fill="#0a0a0c" opacity=".6"/>
      <circle cx="-4" cy="-8" r="2" fill="#edeae3"/><circle cx="4" cy="-8" r="2" fill="#edeae3"/>
    </g>
  </g>

  <!-- floor reflection fade -->
  <rect x="0" y="925" width="800" height="75" fill="url(#bg)" opacity=".75"/>
</svg>
